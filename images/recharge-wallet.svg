  <text x="250" y="565" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#4B5563">自定义额度</text>
  <rect x="250" y="585" width="1010" height="44" rx="10" fill="white" stroke="#D1D5DB"/>
  <text x="265" y="613" font-family="Inter, Arial, sans-serif" font-size="16" fill="#111827">1</text>
  <rect x="1280" y="585" width="190" height="44" rx="10" fill="#F9FAFB" stroke="#D1D5DB"/>
  <text x="1300" y="613" font-family="Inter, Arial, sans-serif" font-size="16" fill="#6B7280">实付金额：</text>
  <text x="1440" y="613" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">1</text>
