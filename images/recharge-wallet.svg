<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#F7F7F8"/>
  <rect x="190" y="54" width="1360" height="792" rx="22" fill="white" stroke="#E5E7EB"/>
