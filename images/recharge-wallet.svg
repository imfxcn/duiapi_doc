    <text x="580" y="465" font-size="24" font-weight="700" fill="#111827">20</text>
    <text x="580" y="490" font-size="15" fill="#6B7280">Pay 20</text>
    <rect x="870" y="430" width="290" height="70" rx="10" fill="#F3F4F6"/>
    <text x="890" y="465" font-size="24" font-weight="700" fill="#111827">50</text>
    <text x="890" y="490" font-size="15" fill="#6B7280">Pay 50</text>
    <rect x="1180" y="430" width="290" height="70" rx="10" fill="#F3F4F6"/>
    <text x="1200" y="465" font-size="24" font-weight="700" fill="#111827">100</text>
    <text x="1200" y="490" font-size="15" fill="#6B7280">Pay 100</text>
